# Enable this to get bug fixes and support asap
auto-update: true

worlds:

  # The name of your world that is Earth.
  # This should be the main survival world where normal Earth respawns are kept.
  earth-name: world

  # If set to true, players can use Nether portals in Galactifun planet worlds.
  allow-nether-portals: false

  # Keep Galactifun-created alien worlds loaded while the addon is enabled.
  # World managers may register these worlds, but Galactifun must retain their runtime lifecycle.
  protect-managed-worlds: true

integrations:

  multiverse:

    # Register Galactifun-created alien worlds with Multiverse-Core after Galactifun loads them.
    # Multiverse entries are kept non-autoloading so Galactifun always supplies the real generator first.
    register-worlds: true

player-safety:

  # Seconds of emergency atmosphere/oxygen protection when a player has no breathable oxygen.
  # This gives accidental visitors time to leave before Galactifun starts applying atmosphere damage.
  # Set to 0 to disable the emergency reserve.
  emergency-oxygen-buffer-seconds: 30

  # If a player dies in a Galactifun planetary world, return them to their valid Earth/survival
  # respawn point. If they do not have one in the configured Earth world, use the Earth world spawn.
  # Planet beds will not overwrite the Earth respawn while this option is enabled.
  return-to-earth-bed-on-planet-death: true

travel:

  # Extra normal Bukkit worlds that may launch rockets as if they were Earth.
  # These worlds are NOT converted into Galactifun worlds and do not change death/atmosphere behavior.
  additional-earth-launch-worlds: []

  # Check galactifun.travel.<planet_id> before allowing a rocket to travel to a planet.
  enforce-planet-permissions: true

  # Backward-compatible default: if a player has no explicit setting for a planet permission,
  # allow the trip. Explicit false permissions from LuckPerms/etc. are still respected.
  permission-default-allow: true

discovery:

  # Persist each player's first visit to every Galactifun planetary world.
  enabled: true

  first-visit:

    # Tell the player when a planet is recorded for the first time.
    show-message: true

    # Console commands run for every first visit. Placeholders:
    # {player}, {uuid}, {planet}, {planet_id}
    global-commands: []

    # Optional commands per planet ID, for example:
    # commands:
    #   mars:
    #     - "lp user {player} permission set galactifun.visited.mars true"
    commands: {}

aliens:

  # How often aliens tick in Minecraft ticks - there are 20 ticks in 1 second
  tick-interval: 2

  # Maximum number of aliens per player per world
  max-per-player: 8

  # Chance for a Leech to eat an item
  leech-eat-chance: 50

rockets:

  # How long a player may hold a rocket destination reservation before it is automatically released.
  # This closes the multi-player launch race without allowing abandoned reservations to lock a rocket forever.
  reservation-timeout-seconds: 60
  
  # Messages while rocket is launching. Must have at least 4
  launch-msgs: 
    - Forgetting parachutes
    - Restocking snack bin
    - Aligning planets
    - Igniting sun
    - Inventing funny launch messages
    - Thanking TheBusyBiscuit
    - Faking Moon landings
    - Taking one small step
    - Going Boomer
    - Not going home

oxygen-sealer:

  # Keep the historical Galactifun balance by default: each adjacent Super Fan increases the
  # current sealing range by 15%. Set to 50 to mimic the Galactifun-boosted fork.
  super-fan-range-bonus-percent: 15

  # Maximum adjacent Super Fans that can increase a sealer's range. Set to 0 for unlimited.
  maximum-super-fans: 4

  # Hard cap passed to the flood-fill safety scan. Lower values reduce worst-case main-thread work.
  # Set to 0 to disable this extra cap.
  max-sealed-blocks: 300000

  # How often Sealer state is checked. Cached sealed rooms are reused between scans unless dirtied.
  scan-interval-seconds: 3

  # Even unchanged rooms are revalidated occasionally as a safety net for block changes made by
  # other plugins that do not fire normal Bukkit block events.
  safety-refresh-seconds: 60

other:

  # The range that the automatic door checks for players
  auto-door-range: 2

  # Blocks prohibited to be used by the automatic door
  auto-door-banned-types:
    - BEDROCK
    - CAKE
    - BARRIER
    - COMMAND_BLOCK
    - END_PORTAL
    - STRUCTURE_BLOCK

  # Max range for sealed command. High values may impact performance, low values may miss sealed areas.
  # More info: https://github.com/Slimefun-Addon-Community/Galactifun/wiki/Sealing#Range
  sealed-command-max-range: 300000
