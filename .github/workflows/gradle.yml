name: Build Galactifun

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  VERSION: "1.0.7"
  OUTPUT_NAME: "SF_Galactifun1.0.7.jar"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Galactifun
        uses: actions/checkout@v6
      - name: Verify immutable release policy before the build
        run: |
          python3 -m unittest scripts.test_release_immutability -v
          python3 -O -m unittest scripts.test_release_immutability -v
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Download released Slimefun Legacy 4.1.45 JAR
        shell: bash
        run: |
          mkdir -p .ci
          curl --fail --location --silent --show-error https://github.com/wickidcow/Slimefun-Legacy/releases/download/v4.1.45/Slimefun-Legacy4.1.45.jar --output .ci/Slimefun-Legacy4.1.45.jar
          echo "3a6b1a377507f7a5ee542b1e062e5d67e13d80e1f200ecb5f0be58fe8c26011c  .ci/Slimefun-Legacy4.1.45.jar" | sha256sum --check --strict
          echo "SLIMEFUN_CORE_JAR=.ci/Slimefun-Legacy4.1.45.jar" >> "$GITHUB_ENV"
      - name: Verify canonical release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]
          test "$OUTPUT_NAME" = "SF_Galactifun${VERSION}.jar"
          grep -Fq 'archiveFileName.set("SF_Galactifun${project.version}.jar")' build.gradle.kts
      - name: Build universal release on 1.21.11 baseline
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon -PslimefunCoreJar="$SLIMEFUN_CORE_JAR" -PpaperVersion=1.21.11-R0.1-SNAPSHOT -PtargetJvm=21 -PprojectVersion=1.0.7
      - name: Verify canonical shaded release artifact
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/${OUTPUT_NAME}"
          test -f "$JAR"
          test "$(find build/libs -maxdepth 1 -type f -name '*.jar' | wc -l)" -eq 1
          unzip -p "$JAR" plugin.yml | tee /tmp/galactifun-plugin.yml
          grep -F "name: Galactifun" /tmp/galactifun-plugin.yml
          grep -F "version: '1.0.7'" /tmp/galactifun-plugin.yml
          if grep -Eiq '^version:.*(legacy|english|snapshot)' /tmp/galactifun-plugin.yml; then exit 1; fi
          grep -F "api-version: '1.21.11'" /tmp/galactifun-plugin.yml
          jar tf "$JAR" | grep -Fxq 'io/github/addoncommunity/galactifun/infinitylib/core/AbstractAddon.class'
          if jar tf "$JAR" | grep -q '^io/github/mooy1/infinitylib/'; then
            echo 'Unrelocated InfinityLib classes detected in distributable JAR.' >&2
            exit 1
          fi
          javap -classpath "$JAR" io.github.addoncommunity.galactifun.Galactifun | grep -Fq 'extends io.github.addoncommunity.galactifun.infinitylib.core.AbstractAddon'
          javap -verbose -classpath "$JAR" io.github.addoncommunity.galactifun.Galactifun | grep -F "major version: 65"
          if jar tf "$JAR" | grep -q '^io/github/thebusybiscuit/slimefun4/'; then exit 1; fi
          if jar tf "$JAR" | grep -q '^org/mvplugins/multiverse/'; then exit 1; fi
          mkdir -p dist
          cp "$JAR" "dist/${OUTPUT_NAME}"
          sha256sum "dist/${OUTPUT_NAME}"
      - name: Verify Paper 26.2 compilation
        run: ./gradlew clean compileJava test --no-daemon -PslimefunCoreJar="$SLIMEFUN_CORE_JAR" -PpaperVersion=26.2.build.+ -PtargetJvm=25 -PprojectVersion=1.0.7
      - name: Verify Paper 26.3 alpha compilation
        run: ./gradlew clean compileJava test --no-daemon -PslimefunCoreJar="$SLIMEFUN_CORE_JAR" -PpaperVersion=26.3-rc-3.build.1-alpha -PtargetJvm=25 -PprojectVersion=1.0.7
      - name: Upload canonical raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error
