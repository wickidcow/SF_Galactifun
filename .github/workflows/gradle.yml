name: Build Galactifun Legacy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Galactifun
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download released Slimefun Legacy 4.1.45 JAR
        shell: bash
        run: |
          mkdir -p .ci
          curl --fail --location --silent --show-error \
            https://github.com/wickidcow/Slimefun-Legacy/releases/download/v4.1.45/Slimefun-Legacy4.1.45.jar \
            --output .ci/Slimefun-Legacy4.1.45.jar

          echo "3a6b1a377507f7a5ee542b1e062e5d67e13d80e1f200ecb5f0be58fe8c26011c  .ci/Slimefun-Legacy4.1.45.jar" \
            | sha256sum --check --strict

          echo "SLIMEFUN_CORE_JAR=.ci/Slimefun-Legacy4.1.45.jar" >> "$GITHUB_ENV"
          echo "Compiling against published Slimefun Legacy 4.1.45 release JAR"

      - name: Test and build Galactifun 1.0.5
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon -PslimefunCoreJar="$SLIMEFUN_CORE_JAR"

      - name: Verify release artifact
        shell: bash
        run: |
          JAR="build/libs/SF_Glactifun1.0.5.jar"
          test -f "$JAR"

          echo "Verifying plugin metadata"
          unzip -p "$JAR" plugin.yml | tee /tmp/galactifun-plugin.yml
          grep -F "name: Galactifun" /tmp/galactifun-plugin.yml
          grep -F "version: '1.0.5'" /tmp/galactifun-plugin.yml
          grep -F "api-version: '1.21.11'" /tmp/galactifun-plugin.yml
          grep -F "  - Slimefun" /tmp/galactifun-plugin.yml
          grep -F "  - Multiverse-Core" /tmp/galactifun-plugin.yml

          echo "Verifying hardening and compatibility classes"
          jar tf "$JAR" | grep -F "io/github/addoncommunity/galactifun/core/RuntimeCompatibility.class"
          jar tf "$JAR" | grep -F "io/github/addoncommunity/galactifun/core/integrations/MultiverseIntegration.class"
          jar tf "$JAR" | grep -F "io/github/addoncommunity/galactifun/core/managers/RocketLaunchRegistry.class"
          jar tf "$JAR" | grep -F "io/github/addoncommunity/galactifun/core/managers/StargateRegistry.class"
          jar tf "$JAR" | grep -F "io/github/addoncommunity/galactifun/core/managers/StargateTravelValidator.class"
          jar tf "$JAR" | grep -F "io/github/addoncommunity/galactifun/base/items/SpaceSuitUpgrader.class"
          jar tf "$JAR" | grep -F "io/github/addoncommunity/galactifun/core/managers/WorldManager.class"

          echo "Verifying Java 21 bytecode"
          javap -verbose -classpath "$JAR" io.github.addoncommunity.galactifun.Galactifun \
            | grep -F "major version: 65"

          echo "Verifying Slimefun and Multiverse are not shaded into the addon"
          if jar tf "$JAR" | grep -q '^io/github/thebusybiscuit/slimefun4/'; then
            echo "Slimefun classes were unexpectedly bundled into Galactifun" >&2
            exit 1
          fi
          if jar tf "$JAR" | grep -q '^org/mvplugins/multiverse/'; then
            echo "Multiverse classes were unexpectedly bundled into Galactifun" >&2
            exit 1
          fi

          sha256sum "$JAR"

      - name: Upload Galactifun JAR
        uses: actions/upload-artifact@v7
        with:
          name: SF_Glactifun1.0.5
          path: build/libs/SF_Glactifun1.0.5.jar
          if-no-files-found: error

      - name: Publish Galactifun 1.0.5 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.0.5"
          JAR="build/libs/SF_Glactifun1.0.5.jar"
          TITLE="SF_Glactifun v1.0.5"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$JAR" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "Galactifun Legacy 1.0.5 stable build for Slimefun Legacy. Supports the Paper 1.21.11 API baseline while retaining Paper/Purpur 26.2 compatibility, Multiverse integration, rocket/stargate travel safeguards, and Java 21 bytecode."
          fi
