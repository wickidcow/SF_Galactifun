name: Build Galactifun Legacy

on:
  push:
    branches: [ master, legacy-1.0-modernization ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: galactifun-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download Slimefun Legacy 4.1.45
        run: |
          mkdir -p lib
          curl --fail --location --retry 3 \
            https://github.com/wickidcow/Slimefun-Legacy/releases/download/v4.1.45/Slimefun-Legacy4.1.45.jar \
            --output lib/Slimefun-Legacy.jar

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SF_Galactifun1.0.0
          path: build/libs/SF_Galactifun1.0.0.jar
          if-no-files-found: error
