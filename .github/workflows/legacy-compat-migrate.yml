name: One-shot Legacy stack compatibility migration

on:
  push:
    branches: [ legacy-1.0-modernization ]
    paths:
      - '.github/workflows/legacy-compat-migrate.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: legacy-1.0-modernization
          fetch-depth: 0

      - name: Apply Slimefun Legacy stack compatibility edits
        shell: python
        run: |
          from pathlib import Path

          def replace(path, replacements):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  if old not in text:
                      print(f'not found (already fixed?): {path}: {old}')
                  text = text.replace(old, new)
              if text != original:
                  p.write_text(text, encoding='utf-8')
                  print(f'updated {path}')

          replace('src/main/java/io/github/addoncommunity/galactifun/core/managers/WorldManager.java', [
              ('item.item().clone()', 'item.clone()'),
          ])

          replace('src/main/java/io/github/addoncommunity/galactifun/base/BaseMats.java', [
              ('HEAVY_DUTY_SHEET.item()', 'HEAVY_DUTY_SHEET.clone()'),
              ('TUNGSTEN_CARBIDE.item()', 'TUNGSTEN_CARBIDE.clone()'),
              ('SPACE_GRADE_PLATE.item()', 'SPACE_GRADE_PLATE.clone()'),
              ('new SlimefunItemStack(FUSION_PELLET, 8).item()', 'new SlimefunItemStack(FUSION_PELLET, 8)'),
              ('new SlimefunItemStack(LASERITE_DUST, 12).item()', 'new SlimefunItemStack(LASERITE_DUST, 12)'),
              ('LASERITE.item()', 'LASERITE.clone()'),
              ('SULFUR_BLOCK.item()', 'SULFUR_BLOCK.clone()'),
              ('new SlimefunItemStack(SlimefunItems.SULFATE, 9).item()', 'new SlimefunItemStack(SlimefunItems.SULFATE, 9)'),
              ('MARS_ROCK.item()', 'MARS_ROCK.clone()'),
              ('new SlimefunItemStack(MARS_DUST, 4).item()', 'new SlimefunItemStack(MARS_DUST, 4)'),
              ('MOON_ROCK.item()', 'MOON_ROCK.clone()'),
              ('new SlimefunItemStack(MOON_DUST, 4).item()', 'new SlimefunItemStack(MOON_DUST, 4)'),
              ('METHANE_ICE.item()', 'METHANE_ICE.clone()'),
              ('new SlimefunItemStack(Gas.METHANE.item(), 4).item()', 'new SlimefunItemStack(Gas.METHANE.item(), 4)'),
              ('if (obj instanceof SlimefunItemStack sfi) return sfi.item();', 'if (obj instanceof SlimefunItemStack sfi) return sfi.clone();'),
              ('if (obj instanceof Gas gas) return gas.item().item();', 'if (obj instanceof Gas gas) return gas.item().clone();'),
              ('new SlimefunItemStack(item, output).item()', 'new SlimefunItemStack(item, output)'),
          ])

          replace('src/main/java/io/github/addoncommunity/galactifun/base/BaseItems.java', [
              ('.item().item()', '.item().clone()'),
              ('SlimefunItems.CARBON.item()', 'SlimefunItems.CARBON.clone()'),
              ('SlimefunItems.OIL_BUCKET.item()', 'SlimefunItems.OIL_BUCKET.clone()'),
              ('if (obj instanceof SlimefunItemStack sfi) return sfi.item();', 'if (obj instanceof SlimefunItemStack sfi) return sfi.clone();'),
              ('return gas.item().item();', 'return gas.item().clone();'),
          ])

      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo 'No compatibility changes required.'
            exit 0
          fi
          git config user.name 'wickidcow-build'
          git config user.email 'actions@users.noreply.github.com'
          git add src/main/java
          git commit -m 'compat: align item stack access with Slimefun Legacy'
          git push origin HEAD:legacy-1.0-modernization
