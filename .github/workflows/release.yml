name: Release Galactifun

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example v1.0.7)'
        required: true
        default: 'v1.0.7'
      publish:
        description: 'Explicitly publish a distinct, never-before-published version'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

env:
  VERSION: "1.0.7"
  OUTPUT_NAME: "SF_Galactifun1.0.7.jar"

jobs:
  release:
    if: inputs.publish == true
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify immutable release policy before packaging
        run: |
          python3 -m unittest scripts.test_release_immutability -v
          python3 -O -m unittest scripts.test_release_immutability -v
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download released Slimefun Legacy 4.1.45 JAR
        shell: bash
        run: |
          mkdir -p .ci
          curl --fail --location --silent --show-error \
            https://github.com/wickidcow/Slimefun-Legacy/releases/download/v4.1.45/Slimefun-Legacy4.1.45.jar \
            --output .ci/Slimefun-Legacy4.1.45.jar
          echo "3a6b1a377507f7a5ee542b1e062e5d67e13d80e1f200ecb5f0be58fe8c26011c  .ci/Slimefun-Legacy4.1.45.jar" \
            | sha256sum --check --strict
          echo "SLIMEFUN_CORE_JAR=.ci/Slimefun-Legacy4.1.45.jar" >> "$GITHUB_ENV"

      - name: Build universal release JAR
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon \
            -PslimefunCoreJar="$SLIMEFUN_CORE_JAR" \
            -PpaperVersion=1.21.11-R0.1-SNAPSHOT \
            -PprojectVersion="$VERSION"

      - name: Verify release JAR
        shell: bash
        run: |
          JAR="build/libs/${OUTPUT_NAME}"
          test -s "$JAR"
          unzip -p "$JAR" plugin.yml | grep -F "version: '1.0.7'"
          unzip -p "$JAR" plugin.yml | grep -F "api-version: '1.21.11'"
          javap -verbose -classpath "$JAR" io.github.addoncommunity.galactifun.Galactifun \
            | grep -F "major version: 65"

      - name: Verify Paper 26.3 alpha compilation
        run: ./gradlew clean compileJava test --no-daemon -PslimefunCoreJar="$SLIMEFUN_CORE_JAR" -PpaperVersion=26.3-rc-3.build.1-alpha -PprojectVersion="$VERSION"

      - name: Publish a new release only; refuse existing tags and assets
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if [[ "$REQUESTED_TAG" != "$TAG" ]]; then
            echo "Refusing to publish a tag that differs from the packaged version: $REQUESTED_TAG" >&2
            exit 1
          fi
          # Manual dispatch from a review branch must never publish.
          if [[ "$GITHUB_REF" != refs/heads/master ]]; then
            echo "Refusing to publish from a non-default branch: $GITHUB_REF" >&2
            exit 1
          fi
          JAR="build/libs/${OUTPUT_NAME}"
          test -s "$JAR"
          # Exit 0 = tag exists, 2 = absent, other errors must fail closed.
          tag_status=0
          tag_result="$(git ls-remote --exit-code --refs origin "refs/tags/$TAG" 2>&1)" || tag_status=$?
          if [[ "$tag_status" -eq 0 ]]; then
            echo "Refusing to reuse existing immutable tag $TAG" >&2
            exit 1
          fi
          if [[ "$tag_status" -ne 2 ]]; then
            echo "Unable to verify immutable tag absence: $tag_result" >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to modify the existing immutable release $TAG" >&2
            exit 1
          fi
          gh release create "$TAG" "$JAR" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "SF_Galactifun $TAG" \
            --notes "Galactifun $TAG: canonical raw ${OUTPUT_NAME} release."
