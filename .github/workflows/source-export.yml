name: Export Modernization Source

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/source-export.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fetch Slimefun Legacy 4.1.45 reference
        run: |
          git clone --depth 1 --branch v4.1.45 https://github.com/wickidcow/Slimefun-Legacy.git slimefun-legacy
          curl --fail --location --silent --show-error \
            https://github.com/wickidcow/Slimefun-Legacy/releases/download/v4.1.45/Slimefun-Legacy4.1.45.jar \
            --output Slimefun-Legacy4.1.45.jar
      - name: Package modernization sources
        run: |
          zip -qr SF_Galactifun-source.zip src build.gradle.kts settings.gradle.kts gradle.properties .github/workflows/gradle.yml README.md || true
          zip -qr Slimefun-Legacy4.1.45-reference.zip slimefun-legacy/src Slimefun-Legacy4.1.45.jar
      - name: Upload Galactifun source snapshot
        uses: actions/upload-artifact@v7
        with:
          name: SF_Galactifun-source
          path: SF_Galactifun-source.zip
          if-no-files-found: error
      - name: Upload Slimefun Legacy reference
        uses: actions/upload-artifact@v7
        with:
          name: Slimefun-Legacy4.1.45-reference
          path: Slimefun-Legacy4.1.45-reference.zip
          if-no-files-found: error
