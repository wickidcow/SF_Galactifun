name: Apply Galactifun Modernization

on:
  push:
    branches: [master]
    paths:
      - '.github/modernization.ready'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Assemble and apply modernization patch
        shell: bash
        run: |
          cat .github/modernization.patch.part-* | tr -d '\n\r' > /tmp/modernization.patch.gz.b64
          echo "a29186b4548efe1741027b9497ced0c1d82cbe2ddbb8dbda6084c55db3b6a74d  /tmp/modernization.patch.gz.b64" | sha256sum --check --strict
          base64 --decode /tmp/modernization.patch.gz.b64 | gzip -dc > /tmp/modernization.patch
          patch --batch --forward -p1 < /tmp/modernization.patch
          git diff --check
      - name: Commit modernized source
        shell: bash
        run: |
          git config user.name 'wickidcow'
          git config user.email 'jaywago@gmail.com'
          git add src
          git diff --cached --quiet && exit 0
          git commit -m 'Modernize Galactifun for Paper 26.2 APIs'
          git push origin HEAD:master
