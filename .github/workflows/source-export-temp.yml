name: Port Galactifun to Legacy 4.1.45

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  port:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Remove post-4.1.45 item bridge dependency
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          root = Path('src/main/java')
          replacements = {
              'SlimefunItems.OIL_BUCKET.item()': 'SlimefunItems.OIL_BUCKET.clone()',
              'SlimefunItems.FUEL_BUCKET.item()': 'SlimefunItems.FUEL_BUCKET.clone()',
              'SlimefunItems.CARBON.item()': 'SlimefunItems.CARBON.clone()',
              'SlimefunItems.LAVA_CRYSTAL.item()': 'SlimefunItems.LAVA_CRYSTAL.clone()',
              'BaseItems.ASSEMBLY_TABLE.item()': 'BaseItems.ASSEMBLY_TABLE.clone()',
              'BaseItems.CIRCUIT_PRESS.item()': 'BaseItems.CIRCUIT_PRESS.clone()',
              'BaseItems.DIAMOND_ANVIL.item()': 'BaseItems.DIAMOND_ANVIL.clone()',
              'BaseMats.FUSION_PELLET.item()': 'BaseMats.FUSION_PELLET.clone()',
              'BaseMats.MOON_CHEESE.item().clone()': 'BaseMats.MOON_CHEESE.clone()',
              'BaseMats.TUNGSTEN_INGOT.item()': 'BaseMats.TUNGSTEN_INGOT.clone()',
              'Gas.WATER.item().item()': 'Gas.WATER.item().clone()',
              'Gas.OXYGEN.item().item()': 'Gas.OXYGEN.item().clone()',
              'Gas.HYDROGEN.item().item()': 'Gas.HYDROGEN.item().clone()',
              'Gas.CARBON_DIOXIDE.item().item()': 'Gas.CARBON_DIOXIDE.item().clone()',
              'Gas.METHANE.item().item()': 'Gas.METHANE.item().clone()',
              'Gas.HYDROCARBONS.item().item()': 'Gas.HYDROCARBONS.item().clone()',
              'Gas.AMMONIA.item().item()': 'Gas.AMMONIA.item().clone()',
              'Gas.NITROGEN.item().item()': 'Gas.NITROGEN.item().clone()',
              'Gas.ARGON.item().item()': 'Gas.ARGON.item().clone()',
              'NITROGEN.item.item()': 'NITROGEN.item.clone()',
              'NITROGEN.item().item()': 'NITROGEN.item().clone()',
              'HYDROGEN.item().item()': 'HYDROGEN.item().clone()',
              'HYDROCARBONS.item().item()': 'HYDROCARBONS.item().clone()',
              'AMMONIA.item().item()': 'AMMONIA.item().clone()',
              'METHANE.item().item()': 'METHANE.item().clone()',
              'HELIUM.item().item()': 'HELIUM.item().clone()',
          }

          for path in root.rglob('*.java'):
              text = path.read_text()
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)

              if path.name == 'WorldManager.java':
                  text = text.replace('item.item().clone()', 'item.clone()')
              elif path.name == 'CustomItemStack.java':
                  text = text.replace('super(item.item());', 'super(item.clone());')
              elif path.name == 'Relic.java':
                  text = text.replace('optionals.add(item.item(), weight);', 'optionals.add(item.clone(), weight);')
                  text = text.replace('required.put(item.item(), new IntIntImmutablePair(min, max));',
                                      'required.put(item.clone(), new IntIntImmutablePair(min, max));')
              elif path.name in {'BaseMats.java', 'BaseItems.java', 'Electrolyzer.java'}:
                  text = text.replace('return sfi.item();', 'return sfi.clone();')
                  text = text.replace('return gas.item().item();', 'return gas.item().clone();')

              if path.name == 'MutantCreeper.java':
                  text = text.replace(
                      'new SlimefunItemStack(BaseMats.MUNPOWDER, ThreadLocalRandom.current().nextInt(2)).item()',
                      'new SlimefunItemStack(BaseMats.MUNPOWDER, ThreadLocalRandom.current().nextInt(2)).clone()')

              if path.name == 'BaseMats.java':
                  for name in ('HEAVY_DUTY_SHEET', 'TUNGSTEN_CARBIDE', 'SPACE_GRADE_PLATE', 'LASERITE',
                               'SULFUR_BLOCK', 'MARS_ROCK', 'MOON_ROCK', 'METHANE_ICE'):
                      text = text.replace(f'{name}.item()', f'{name}.clone()')
                  text = text.replace('new SlimefunItemStack(FUSION_PELLET, 8).item()',
                                      'new SlimefunItemStack(FUSION_PELLET, 8).clone()')
                  text = text.replace('new SlimefunItemStack(LASERITE_DUST, 12).item()',
                                      'new SlimefunItemStack(LASERITE_DUST, 12).clone()')
                  text = text.replace('new SlimefunItemStack(SlimefunItems.SULFATE, 9).item()',
                                      'new SlimefunItemStack(SlimefunItems.SULFATE, 9).clone()')
                  text = text.replace('new SlimefunItemStack(MARS_DUST, 4).item()',
                                      'new SlimefunItemStack(MARS_DUST, 4).clone()')
                  text = text.replace('new SlimefunItemStack(MOON_DUST, 4).item()',
                                      'new SlimefunItemStack(MOON_DUST, 4).clone()')
                  text = text.replace('new SlimefunItemStack(Gas.METHANE.item(), 4).item()',
                                      'new SlimefunItemStack(Gas.METHANE.item(), 4).clone()')
                  text = text.replace('new SlimefunItemStack(item, output).item()',
                                      'new SlimefunItemStack(item, output).clone()')

              if text != original:
                  path.write_text(text)

          runtime = root / 'io/github/addoncommunity/galactifun/core/RuntimeCompatibility.java'
          text = runtime.read_text()
          text = text.replace(
              '            Class<?> slimefunItemStack = Class.forName(\n'
              '                    "io.github.thebusybiscuit.slimefun4.api.items.SlimefunItemStack", false, loader);\n'
              '            slimefunItemStack.getMethod("item");\n',
              '            Class.forName("io.github.thebusybiscuit.slimefun4.api.items.SlimefunItemStack", false, loader);\n')
          text = text.replace(
              '        } catch (NoSuchMethodException missingBridge) {\n'
              '            plugin.getLogger().log(Level.SEVERE,\n'
              '                    "Slimefun Legacy is too old for this Galactifun build. Install a Legacy build that includes the SlimefunItemStack.item() compatibility bridge.",\n'
              '                    missingBridge);\n'
              '            return false;\n', '')
          runtime.write_text(text)

          workflow = Path('.github/workflows/gradle.yml')
          text = workflow.read_text()
          text = text.replace('- name: Checkout Slimefun Legacy\n', '- name: Checkout Slimefun Legacy 4.1.45\n')
          text = text.replace('          ref: master\n          path: .ci/slimefun-legacy',
                              '          ref: v4.1.45\n          path: .ci/slimefun-legacy')
          text = text.replace('- name: Build Slimefun Legacy API\n', '- name: Build Slimefun Legacy 4.1.45 API\n')
          text = text.replace('echo "Compiling against: $CORE_JAR"',
                              'echo "Compiling against released Legacy tag v4.1.45: $CORE_JAR"')
          workflow.write_text(text)

          # This one-shot workflow removes itself in the same source-port commit.
          Path('.github/workflows/source-export-temp.yml').unlink()
          PY

      - name: Commit Legacy 4.1.45 source compatibility
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Support released Slimefun Legacy 4.1.45" || exit 0
          git push origin HEAD:master
