name: Apply Galactifun Modernization 2

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-modernization2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply second modernization pass
        shell: bash
        run: |
          echo "daf14c5bbf16df3a6201d98ec24101b9cc690f6bcfdd49fc7d77cb521d6e12c5  .github/modernization2.patch.gz.b64" | sha256sum --check --strict
          base64 --decode .github/modernization2.patch.gz.b64 | gzip -dc > /tmp/modernization2.patch
          git apply --check /tmp/modernization2.patch
          git apply /tmp/modernization2.patch
          git diff --check
      - name: Commit modernized source and remove transfer files
        shell: bash
        run: |
          git config user.name 'wickidcow'
          git config user.email 'jaywago@gmail.com'
          git rm .github/modernization2.patch.gz.b64 .github/workflows/apply-modernization2.yml
          git add src
          git commit -m 'Modernize remaining Paper and Legacy compatibility APIs'
          git push origin HEAD:master
